# Example 2 — a bundle the platform never signed.
#
# The bundle reference is a plain OCI artifact, so anyone with push access to the
# registry can publish one, exactly as `make unsigned` does from outside the
# platform. Referencing it makes the team's very first step fail: the
# ValidatingAdmissionPolicy refuses the PipelineRun, this definition never gets a
# run, and Pipelines-as-Code reports the refusal on the commit.
#
#   make example-2     pushes this file and shows the refusal
#
# There is no shell in this file and no privilege to escalate: the workload is
# never created. That is the point of enforcing entitlement at admission rather
# than inside a pipeline.
#
# BUNDLE_REF and ZOT_HOST are substituted by demo/scripts/example.sh.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-unsigned
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[unsigned]"
spec:
  pipelineRef:
    resolver: bundles
    params:
      - name: bundle
        # the copy the platform never published and Chains never signed
        value: UNSIGNED_REF
      - name: name
        value: go-service
      - name: kind
        value: Pipeline
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: image
      value: ZOT_HOST/team/app
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    - name: git-auth
      secret:
        secretName: team-git-auth
  taskRunTemplate:
    serviceAccountName: team-app
